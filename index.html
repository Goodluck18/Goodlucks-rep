<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Goodlucks Homes - Rentals & Real Estate in Accra</title>
    <meta name="description" content="Discover apartments, homes and commercial rentals across Greater Accra with transparent pricing. Listings come from registered landlords and agents and are reviewed by Goodlucks staff before they appear." />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!--
      Canonical, og:url and og:image below name the intended permanent domain.

      They are the *fallback* for pages that do not compute their own metadata:
      property pages are rendered by PHP (api/property_page.php) and the sitemap
      by the API, and both build every URL from the configured base URL
      (APP_URL → SITE_URL). So the testing deployment only has to set APP_URL in
      api/.env to advertise its own domain; the permanent domain strategy is
      unchanged and needs no code edit. The React app uses the same rule
      (src/config/site.ts).
    -->
    <link rel="canonical" href="https://goodlucks.co/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Static social defaults.
      These are what WhatsApp, Slack, X and Facebook read, because those crawlers
      do not run the SPA's JavaScript. Per-page values are still injected by
      SEOHead at runtime for Google and other JS-capable crawlers.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Goodlucks Homes" />
    <meta property="og:locale" content="en_GH" />
    <meta property="og:url" content="https://goodlucks.co/" />
    <meta property="og:title" content="Goodlucks Homes - Rentals & Real Estate in Accra" />
    <meta property="og:description" content="Apartments and homes across Greater Accra with transparent pricing, viewings arranged through the platform, and listings reviewed by Goodlucks staff before they appear." />
    <meta property="og:image" content="https://goodlucks.co/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Goodlucks Homes - rentals in Greater Accra, Ghana" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Goodlucks Homes - Rentals & Real Estate in Accra" />
    <meta name="twitter:description" content="Apartments and homes across Greater Accra with transparent pricing, viewings arranged through the platform, and listings reviewed by Goodlucks staff before they appear." />
    <meta name="twitter:image" content="https://goodlucks.co/og-image.jpg" />

    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Goodlucks Homes",
        "url": "https://goodlucks.co/",
        "image": "https://goodlucks.co/og-image.jpg",
        "logo": "https://goodlucks.co/icon-192.png",
        "description": "Rental intermediary connecting tenants with landlords across Greater Accra, Ghana.",
        "telephone": "+233237690080",
        "email": "rentals@goodlucks.co",
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Greater Accra, Ghana"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Accra",
          "addressCountry": "GH"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
